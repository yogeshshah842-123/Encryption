[package]
name = "file-vault"
version = "1.0.0"
edition = "2021"

[lib]
name = "filevault"
crate-type = ["cdylib"]

[dependencies]
rayon = "1.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
ctr = "0.9"
rand = "0.8"
hex = "0.4"
walkdir = "2"
anyhow = "1"
jni = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1